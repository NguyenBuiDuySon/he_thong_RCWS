camera:
  source: 0
  width: 1280
  height: 720
  fps: 30
  backend: dshow

tracker:
  algorithm: bytetrack
  lost_track_buffer: 30
  track_activation_threshold: 0.70
  minimum_consecutive_frames: 2
  minimum_iou_threshold: 0.10
  high_conf_det_threshold: 0.60


targeting:
  lost_timeout_frames: 90
  dead_zone_x_norm: 0.05
  dead_zone_y_norm: 0.05

detector:
  model: yolo26n.pt
  device: auto
  precision: auto
  imgsz: 640
  confidence: 0.25
  max_det: 100
  warmup_iterations: 10

telemetry:
  rolling_window_frames: 120

display:
  window_name: "Vision Tracking System"
  show_crosshair: true