[project]
name = "he-thong-rcws"
version = "0.1.0"
description = "Real-time PC vision tracking system"
requires-python = ">=3.13,<3.14"
dependencies = [
    "numpy>=2.5.2",
    "opencv-python>=4.13,<5",
    "pyyaml>=6.0.3",
    "supervision>=0.30.1",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
    "trackers>=2.6,<3",
    "ultralytics>=8.4.131",
]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]

[tool.pytest]
minversion = "9.0"
testpaths = ["tests"]
pythonpath = ["."]